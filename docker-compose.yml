version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - ci-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - SAM_GOV_API_KEY=${SAM_GOV_API_KEY}
      - EPO_CONSUMER_KEY=${EPO_CONSUMER_KEY}
      - EPO_CONSUMER_SECRET=${EPO_CONSUMER_SECRET}
      - FRONTEND_URL=http://frontend:3000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend/data:/app/data
    networks:
      - ci-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ci-network

networks:
  ci-network:
    driver: bridge

volumes:
  redis-data:
